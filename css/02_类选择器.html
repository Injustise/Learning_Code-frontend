<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>类选择器</title>
    <style>
        .red {
            color: red;
        }
        .size_20px {
            font-size: 20px;
        }
    </style>
</head>
<body>
    <p class="red">我是小红</p>
    <p class="red size_20px">我是大红</p>
</body>
</html>
