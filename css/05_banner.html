<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>banner</title>
    <style>
        .banner {
            height: 500px;

            background-image: url(../picture/bg01.png);
            background-repeat: no-repeat;
            background-size: cover;

            text-align: right;
            /* color: #ff9966; */
        }

        .banner h2 {
            font-weight: 400;
            font-size: 36px;
            line-height: 60px;

            color: #7B4BA8;
        }
        .banner p {
            font-size: 20px;
        }

        .banner a {
            display: inline-block;


            width: 125px;
            height: 40px;
            border-radius: 8px;
            background-color: #66ccff;

            font-size: 20px;
            line-height: 40px;
            text-align: center;

            text-decoration: none;

            color: #fff;
        }
        .banner a:hover {
            background-color: #FF4F8B;
        }
    </style>
</head>
<body>
    <div class="banner">
        <h2> <span style="color: #FF4F8B;">别</span>当<span style="color: #66ccff;">欧</span>尼酱了！</h2>
        <!-- <p>雌堕力~</p> -->
        <a href="https://zh.moegirl.org.cn/%E5%88%AB%E5%BD%93%E6%AC%A7%E5%B0%BC%E9%85%B1%E4%BA%86%EF%BC%81" target="_blank">点击性转</a>
    </div>
</body>
</html>
