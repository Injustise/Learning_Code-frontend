<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>卡片</title>
    <style>
        * {
            padding: 0;
            margin: 0;

            box-sizing: border-box;
        }
        body {
            background-color: #f1f1f1;
        }
        .card {
            margin: 50px auto;
            padding: 40px;

            width: 270px ;
            height: 250px; 
            background-color: #fff;

            text-align: center;
            
            border-radius: 10px;
        }
        .card h3 {
            margin-top: 20px;
            margin-bottom: 12px;
            
            font-size: 18px;
            color: #333;
        }
        .card p {
            font-size: 12px;
            color: #555;
        }
    </style>
</head>
<body>
    <div class="card">
        <img style="border-radius: 50%;" src="../picture/test02.jpg" alt="mortis">
        <h3>MORTIS</h3>
        <p>忘却死亡，迎接新生</p>
    </div>
</body>
</html>
