<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册信息</title>
</head>
<body>
    <h1>注册信息</h1>
    <form action="">
        <h2>个人信息</h2>
            <label>姓名：<input type="text" placeholder="请输入真实姓名"></label> 
            <br><br>
            <label >密码：<input type="password" placeholder="请输入密码"></label>
            <br><br>
            <label >确认密码：<input type="password" placeholder="请再次输入密码"></label>
            <br><br>
            <label>性别：</label>
            <label> <input type="radio" name="gender"> 男 </label>
            <label> <input type="radio" name="gender" checked> 女 </label>
            <br><br>
            <label>居住城市：
                <select>
                    <option>北京</option>
                    <option>上海</option>
                    <option>广州</option>
                    <option>深圳</option>
                    <option>重庆</option>
                    <option selected>焦作</option>
                </select>
            </label>
        <h2>教育经历</h2>
            <label>最高学历：
                <select>
                    <option>博士</option>
                    <option>硕士</option>
                    <option selected>本科</option>
                    <option>大专</option>
                </select>
            </label>
        <h2>工作经历</h2>
            <label>公司名称：<input type="text"></label>
            <br><br>
            <label>工作描述：
                <br>
                <textarea></textarea>
            </label>
        <br><br>
        <label>
            <input type="checkbox" checked> 已阅读并同意以下协议：
        </label>
        <ul>
            <li> <a href="#">《用户服务协议》</a></li>
            <li> <a href="#">《隐私协议》</a></li>
        </ul>
        <br>
        <button>注册</button>
        <button type="reset">重新填写</button>
    </form>
</body>
</html>
